name: Despliegue Continuo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render (opcional con Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render despliega automaticamente cuando estas pruebas pasan (autoDeployTrigger: checksPass)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Despliegue solicitado a Render."

      - name: Verificar disponibilidad de la aplicacion publicada
        run: |
          sleep 120
          curl -fsS --retry 5 --retry-delay 20 --max-time 90 https://taskmanager-devops-d46k.onrender.com/health
