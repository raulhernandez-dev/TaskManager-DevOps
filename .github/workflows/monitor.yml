name: Monitoreo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Verificar disponibilidad y tiempo de respuesta
        id: health
        run: |
          set +e
          resultado=$(curl -s -o respuesta.json -w "%{http_code} %{time_total}" --max-time 90 "${{ vars.APP_URL }}/health")
          codigo=$(echo $resultado | cut -d' ' -f1)
          tiempo=$(echo $resultado | cut -d' ' -f2)
          echo "codigo=$codigo" >> $GITHUB_OUTPUT
          echo "tiempo=$tiempo" >> $GITHUB_OUTPUT
          echo "### Monitoreo de TaskManager" >> $GITHUB_STEP_SUMMARY
          echo "| URL | Código HTTP | Tiempo (s) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ vars.APP_URL }} | $codigo | $tiempo |" >> $GITHUB_STEP_SUMMARY
          cat respuesta.json || true
          [ "$codigo" = "200" ]

      - name: Registrar incidencia si la aplicación no responde
        if: failure()
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Incidencia: la aplicación no responde ($(date -u +%Y-%m-%d))" \
            --label "incidencia" \
            --body "Detectado por el workflow de monitoreo.
          - Fecha de detección: $(date -u)
          - URL: ${{ vars.APP_URL }}/health
          - Código HTTP: ${{ steps.health.outputs.codigo }}
          - Tiempo de respuesta: ${{ steps.health.outputs.tiempo }} s
          - Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
